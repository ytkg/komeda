name: Auto-merge menu data

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'create-pull-request/patch'
    runs-on: ubuntu-latest
    steps:
      - name: Find the update pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          number=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$owner:create-pull-request/patch" |
            jq -r --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
              [.[] | select(.head.sha == $sha and
                            .head.repo.full_name == $repo and
                            .base.ref == "main" and
                            .title == "Update menu data")] |
              if length == 1 then .[0].number else empty end')
          if [[ -z "$number" ]]; then
            echo "No matching open menu update pull request was found."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check changed files
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [[ "$files" != 'config/menus.yaml' ]]; then
            echo "Only config/menus.yaml may change in an auto-merged PR."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.pr.outputs.number != ''

      - uses: ruby/setup-ruby@v1
        if: steps.pr.outputs.number != ''
        with:
          ruby-version: 3.4

      - name: Check removed menu IDs
        if: steps.pr.outputs.number != ''
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          git show HEAD:config/menus.yaml > "$RUNNER_TEMP/base-menus.yaml"
          git show "$HEAD_SHA:config/menus.yaml" > "$RUNNER_TEMP/updated-menus.yaml"
          ruby script/check_menu_removals.rb "$RUNNER_TEMP/base-menus.yaml" "$RUNNER_TEMP/updated-menus.yaml"

      - name: Merge the update pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.MENU_UPDATE_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "The MENU_UPDATE_TOKEN secret is required."
            exit 1
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge -f sha="$HEAD_SHA" --jq '.merged'
