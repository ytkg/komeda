name: Update menu data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update_menu_data:
    runs-on: ubuntu-latest
    steps:
      - name: Check menu update token
        env:
          MENU_UPDATE_TOKEN: ${{ secrets.MENU_UPDATE_TOKEN }}
        run: |
          if [[ -z "$MENU_UPDATE_TOKEN" ]]; then
            echo "The MENU_UPDATE_TOKEN secret is required."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true
      - name: Update menu data
        run: bundle exec ruby script/update_menu_data.rb
      - name: Generate pull request body
        run: bundle exec ruby script/diff_menus.rb > /tmp/update_menu_data_pr_body.md
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.MENU_UPDATE_TOKEN }}
          add-paths: config/menus.yaml
          branch: create-pull-request/patch
          commit-message: Update menu data
          delete-branch: true
          title: Update menu data
          body-path: /tmp/update_menu_data_pr_body.md
