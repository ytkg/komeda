name: Update menu data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update_menu_data:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true
      - name: Update menu data
        run: bundle exec ruby script/update_menu_data.rb
      - name: Generate pull request body
        run: bundle exec ruby script/diff_menus.rb > /tmp/update_menu_data_pr_body.md
      - uses: peter-evans/create-pull-request@v8
        id: update_pr
        with:
          token: ${{ secrets.MENU_UPDATE_TOKEN }}
          add-paths: config/menus.yaml
          branch: create-pull-request/patch
          commit-message: Update menu data
          delete-branch: true
          title: Update menu data
          body-path: /tmp/update_menu_data_pr_body.md
      - name: Enable auto-merge
        if: steps.update_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.MENU_UPDATE_TOKEN }}
          PR_NUMBER: ${{ steps.update_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.auto_merge != null')
          if [[ "$enabled" != 'true' ]]; then
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --merge
          fi

  menu-update-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check menu update files
        if: github.head_ref == 'create-pull-request/patch' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [[ "$files" != 'config/menus.yaml' ]]; then
            echo "Only config/menus.yaml may change in an auto-merged PR."
            exit 1
          fi
